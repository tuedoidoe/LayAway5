name: Automação Diária LayAway5

on:
  schedule:
    - cron: '0 3 * * *' # 00:00 Horário de Brasília
  workflow_dispatch: 

jobs:
  atualizar-base:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essencial para permitir o push de volta

    steps:
      - name: Puxar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install pandas requests

      - name: Executar Script
        run: python update_scores.py "${{ secrets.TELEGRAM_TOKEN }}" "${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Salvar no GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add base_livescore_api_2025_hoje.csv
          git commit -m "Automated update: $(date +'%Y-%m-%d')" || echo "Sem mudanças"
          git push
