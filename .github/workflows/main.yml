name: Automação Diária LayAway5

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: 

jobs:
  atualizar-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas requests
      - name: Executar Script
        # AQUI ESTÁ O SEGREDO: Passando os secrets como argumentos
        run: python update_scores.py "${{ secrets.TELEGRAM_TOKEN }}" "${{ secrets.TELEGRAM_CHAT_ID }}"
      - name: Salvar Mudanças
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add base_livescore_api_2025_hoje.csv
          git commit -m "Update scores" || echo "No changes"
          git push
