name: Automação Diária LayAway5

on:
  schedule:
    # Roda às 03:17 UTC (00:17 no horário do Brasil)
    - cron: '17 1 * * *' 
  workflow_dispatch:

jobs:
  atualizar-base:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Puxar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' 

      - name: Instalar dependências
        run: pip install pandas requests

      - name: Executar Script
        run: python update_scores.py "${{ secrets.TELEGRAM_TOKEN }}" "${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Salvar no GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Adiciona todas as mudanças (incluindo o novo .json)
          git add .
          
          # Só faz o commit se houver mudanças reais para evitar erros
          if ! git diff --cached --exit-code; then
            git commit -m "⚽ Automated update: $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main 
            git push origin main
          else
            echo "Nenhuma mudança detectada na base hoje."
          fi
